<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e7e4dc" />
    <script>
      // Apply a saved theme before first paint, so dark-mode users never see a light flash.
      try {
        var t = localStorage.getItem("catchment.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Catchment · Geo-targeting plans from Overture data</title>
    <meta
      name="description"
      content="Find the neighbourhoods worth paying for. Catchment scores every block of a city for your customer using Overture Maps data, then exports ZIPs and radius pins for Meta and Google Ads."
    />
    <meta property="og:title" content="Catchment" />
    <meta property="og:description" content="Geo-targeting plans for local-service ads, built on Overture Maps." />
    <meta property="og:image" content="./og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Catchment is an interactive map and needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
